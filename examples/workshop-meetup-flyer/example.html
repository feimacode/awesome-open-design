<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Workshop / Meetup Flyer</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111111;
    --paper:#ffffff;
    --accent:#d9691f;
    --accent-ink:#ffffff;
    --rule:#111111;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:#e9e6df;
    font-family:'Archivo', sans-serif;
    display:grid;
    place-items:center;
    padding:40px 0;
  }
  .flyer{
    position:relative;
    width:850px;
    max-width:94vw;
    aspect-ratio:8.5/11;
    background:var(--paper);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    box-shadow:0 30px 80px -30px rgba(0,0,0,0.35);
  }
  .band{
    background:var(--accent);
    color:var(--accent-ink);
    padding:56px 56px 48px;
    flex:none;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    font-weight:500;
    letter-spacing:0.32em;
    text-transform:uppercase;
    margin-bottom:28px;
  }
  .headline{
    font-weight:900;
    font-size:64px;
    line-height:0.98;
    letter-spacing:-0.02em;
    margin:0 0 22px;
  }
  .dek{
    font-size:19px;
    font-weight:500;
    line-height:1.5;
    max-width:80%;
    opacity:0.96;
  }
  .body{
    flex:1;
    padding:48px 56px 40px;
    display:flex;
    flex-direction:column;
  }
  .info-list{
    display:flex;
    flex-direction:column;
  }
  .info-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:24px;
    padding:20px 0;
    border-top:1.5px solid var(--rule);
  }
  .info-row:last-child{
    border-bottom:1.5px solid var(--rule);
  }
  .info-label{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    font-weight:500;
    letter-spacing:0.24em;
    text-transform:uppercase;
    color:var(--accent);
    flex:none;
  }
  .info-value{
    font-size:22px;
    font-weight:700;
    text-align:right;
  }
  .note{
    margin-top:32px;
    font-size:16px;
    line-height:1.6;
    max-width:70%;
  }
  .footer{
    margin-top:auto;
    padding-top:28px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:24px;
  }
  .rsvp-label{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    font-weight:500;
    letter-spacing:0.24em;
    text-transform:uppercase;
  }
  .rsvp-value{
    font-size:20px;
    font-weight:700;
    text-decoration:underline;
    text-underline-offset:5px;
    text-decoration-thickness:2px;
  }
  .tag{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    font-weight:500;
    letter-spacing:0.1em;
    color:#7a7a7a;
  }
</style>
</head>
<body>
<div class="flyer">
  <div class="band">
    <div class="eyebrow">Workshop · In Person</div>
    <h1 class="headline">— Workshop<br/>Title —</h1>
    <div class="dek">— one-line description of what happens in this session —</div>
  </div>

  <div class="body">
    <div class="info-list">
      <div class="info-row">
        <div class="info-label">Date</div>
        <div class="info-value">—</div>
      </div>
      <div class="info-row">
        <div class="info-label">Time</div>
        <div class="info-value">—</div>
      </div>
      <div class="info-row">
        <div class="info-label">Location</div>
        <div class="info-value">—</div>
      </div>
    </div>

    <div class="note">Bring a laptop and your own project — no prior experience required. Space is limited to keep the group workable.</div>

    <div class="footer">
      <div>
        <div class="rsvp-label">RSVP</div>
        <div class="rsvp-value">—</div>
      </div>
      <div class="tag">01 / SESSION</div>
    </div>
  </div>
</div>
</body>
</html>
