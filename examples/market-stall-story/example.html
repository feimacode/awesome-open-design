<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Find Us at the Market — Story</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --glaze:#2f5d73;
    --clay:#e7d3bd;
    --terracotta:#c4622d;
    --ink:#1d1a17;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:#cfc6ba;
    display:grid;
    place-items:center;
    padding:40px 0;
    font-family:'Space Grotesk', sans-serif;
    color:var(--ink);
  }
  /* story: 1080 × 1920, shown at 405 × 720. Top 250 px and bottom 340 px (full size) stay clear of app chrome. */
  .story{
    width:405px;
    aspect-ratio:9/16;
    background:var(--clay);
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    padding:96px 30px 128px;
    box-shadow:0 30px 70px -30px rgba(0,0,0,.4);
  }
  .awning{
    position:absolute; top:0; left:0; right:0; height:58px;
    background:repeating-linear-gradient(90deg, var(--glaze) 0 45px, var(--clay) 45px 90px);
  }
  .awning::after{
    content:""; position:absolute; left:0; right:0; bottom:-14px; height:14px;
    background:radial-gradient(circle at 22.5px 0, var(--glaze) 22px, transparent 23px) 0 0 / 90px 14px repeat-x;
  }
  .kicker{
    font-size:13px; font-weight:700; letter-spacing:.2em; text-transform:uppercase;
    color:var(--terracotta);
  }
  h1{
    font-family:'Instrument Serif', serif; font-weight:400;
    font-size:68px; line-height:.92; margin:10px 0 0; letter-spacing:-.01em;
  }
  h1 em{ color:var(--glaze); }
  .pots{ margin:18px auto 6px; width:100%; }
  .when{
    background:var(--ink); color:var(--clay);
    padding:16px 18px; margin-top:auto;
    display:grid; grid-template-columns:auto 1fr; gap:6px 14px;
    font-size:15px;
  }
  .when dt{ font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--terracotta); padding-top:3px; }
  .when dd{ margin:0; font-weight:500; }
  .sign{ margin-top:14px; font-size:14px; font-weight:500; display:flex; justify-content:space-between; }
</style>
</head>
<body>
  <main class="story" data-od-card>
    <div class="awning" aria-hidden="true"></div>
    <div class="kicker">This Saturday</div>
    <h1>Come find<br>us at the<br><em>market</em></h1>

    <svg class="pots" viewBox="0 0 345 170" aria-hidden="true">
      <rect x="0" y="150" width="345" height="8" fill="#1d1a17"/>
      <path d="M22 150 C14 112 26 74 58 68 H86 C118 74 130 112 122 150Z" fill="#2f5d73"/>
      <path d="M50 68 V56 H94 V68" fill="none" stroke="#2f5d73" stroke-width="6"/>
      <path d="M30 104 H114" stroke="#e7d3bd" stroke-width="3" stroke-dasharray="6 6"/>
      <path d="M150 150 L140 92 H226 L216 150Z" fill="#c4622d"/>
      <rect x="134" y="80" width="98" height="14" rx="3" fill="#c4622d"/>
      <path d="M183 80 C 170 50, 178 30, 196 18 M183 80 C 196 58, 214 52, 228 54" fill="none" stroke="#2f5d73" stroke-width="5" stroke-linecap="round"/>
      <path d="M256 150 C250 128 252 112 262 104 H314 C324 112 326 128 320 150Z" fill="#1d1a17"/>
      <ellipse cx="288" cy="104" rx="26" ry="6" fill="#2f5d73"/>
    </svg>

    <dl class="when">
      <dt>Where</dt><dd>— Market name —, stall —</dd>
      <dt>When</dt><dd>— Saturday, date —, 9:00–14:00</dd>
      <dt>Bring</dt><dd>A bag for your new mugs</dd>
    </dl>
    <div class="sign"><span>Hand-thrown ceramics</span><span>— @yourhandle —</span></div>
  </main>
</body>
</html>
