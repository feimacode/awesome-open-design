<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Flow — Liquid Background Hero</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12;font-family:system-ui,-apple-system,sans-serif}
  canvas#fluid{position:fixed;inset:0;width:100%;height:100%;z-index:0}
  .overlay{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;pointer-events:none}
  .badge{display:inline-block;font-size:.75rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#fff;border:1.5px solid rgba(255,255,255,.45);border-radius:999px;padding:.5em 1.5em;margin-bottom:1.6rem;background:rgba(255,255,255,.08);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 0 20px rgba(255,255,255,.1),0 0 40px rgba(100,180,255,.12);animation:fadeUp .8s ease both}
  .quote{font-size:clamp(1.6rem,4.5vw,3.4rem);font-weight:700;line-height:1.2;color:#fff;max-width:22ch;text-shadow:0 2px 24px rgba(0,0,0,.45);animation:fadeUp .8s .15s ease both}
  .quote em{font-style:normal;background:linear-gradient(135deg,#6ee7b7,#3b82f6,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .byline{margin-top:1.4rem;font-size:clamp(.82rem,1.6vw,1.05rem);font-weight:500;color:rgba(255,255,255,.45);letter-spacing:.04em;animation:fadeUp .8s .3s ease both}
  .byline span{color:rgba(255,255,255,.7)}
  .cta-row{margin-top:2.2rem;display:flex;gap:.8rem;animation:fadeUp .8s .45s ease both}
  .cta{pointer-events:auto;font-size:.82rem;font-weight:600;letter-spacing:.06em;padding:.7em 1.8em;border-radius:999px;border:none;cursor:pointer;transition:transform .15s,box-shadow .25s}
  .cta-primary{background:linear-gradient(135deg,#6ee7b7,#3b82f6);color:#0a0a12;box-shadow:0 4px 20px rgba(99,179,237,.3);border-radius:8px}
  .cta-primary:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(99,179,237,.45)}
  .cta-ghost{background:rgba(255,255,255,.08);color:rgba(255,255,255,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .cta-ghost:hover{background:rgba(255,255,255,.14);color:#fff}
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<canvas id="fluid"></canvas>
<div class="overlay">
  <div class="badge">Multi-Agent Orchestration</div>
  <p class="quote"><em>@flow</em> your workflows.<br>Version them like code.</p>
  <p class="byline">AI Flow &mdash; <span>Define roles. Run the flow. Trust the output.</span></p>
  <div class="cta-row">
    <button class="cta cta-primary">Get Started</button>
    <button class="cta cta-ghost">View on GitHub</button>
  </div>
</div>

<script>
/* ── Fluid Displacement WebGL ──────────────────────────── */
const canvas = document.getElementById('fluid');
const gl = canvas.getContext('webgl', { alpha: false, antialias: false }) || canvas.getContext('experimental-webgl');
if (!gl) { canvas.style.background = 'linear-gradient(135deg,#0a0a12,#1a1a2e)'; }

/* Resize handler */
function resize() {
  const dpr = Math.min(window.devicePixelRatio, 2);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

/* ── Shaders ───────────────────────────────────────────── */
const VERT = `
attribute vec2 a_pos;
void main(){ gl_Position = vec4(a_pos,0,1); }
`;

const FRAG = `
precision highp float;
uniform vec2 u_res;
uniform float u_time;

/* Simplex 2D noise — compact implementation */
vec3 permute(vec3 x){ return fract(((x*34.0)+1.0)*x); }

float snoise(vec2 v){
  const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                     -0.577350269189626, 0.024390243902439);
  vec2 i  = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0,0.0) : vec2(0.0,1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = fract(i);
  vec4 p = permute(permute(i.y + vec4(0, i1.y, 1.0, 1.0))
                         + i.x + vec4(0, i1.x, 1.0, 1.0));
  vec4 j = p - 4.0 * floor(p * 0.25);
  vec4 x_ = 0.5 - abs(j) - 4.0 * (0.5 - abs(j)) * (0.5 - abs(j));
  vec4 h = 0.5 - abs(j) - 4.0 * (0.5 - abs(j)) * (0.5 - abs(j));
  vec4 a0 = x_ * x_;
  vec3 g = vec3(x0.x * a0.x, x0.y, x12.x * a0.y);
  vec2 a1 = a0.zw * vec2(x12.x, x12.z);
  vec3 a2 = vec3(1.0, x0.y, x12.z);
  g.x *= 0.7 * (h.x * h.x); g.y *= 0.7 * (h.y * h.y);
  vec3 norm = 1.0 / vec3(dot(g,g), dot(a0*a0+vec2(a1.x,a1.y),a0*a0+vec2(a1.x,a1.y)),
                           dot(a2*a2+vec2(a1.x,a1.y),a2*a2+vec2(a1.x,a1.y)));
  g *= norm.x; a0 *= norm.y; a2 *= norm.z;
  float nz = max(g.y + a0.y + a2.y, 0.0);
  return 0.5 + 0.5 * nz;
}

/* FBM — layered turbulence */
float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  mat2 rot = mat2(0.87, 0.5, -0.5, 0.87);
  for(int i = 0; i < 6; i++){
    v += a * snoise(p);
    p = rot * p * 2.05 + vec2(100.0);
    a *= 0.5;
  }
  return v;
}

/* Palette — shifts with time */
vec3 palette(float t){
  vec3 a = vec3(0.12, 0.15, 0.30);   /* deep base */
  vec3 b = vec3(0.30, 0.38, 0.55);   /* dark blue */
  vec3 c = vec3(0.15, 0.25, 0.40);   /* mid teal */
  vec3 d = vec3(0.50, 0.95, 0.78);   /* mint accent */
  vec3 e = vec3(0.35, 0.62, 1.00);   /* blue accent */
  vec3 f = vec3(0.75, 0.65, 1.00);   /* purple accent */
  float s = fract(t * 0.12);
  vec3 lo = mix(a, b, smoothstep(0.0, 0.33, s));
  vec3 mid = mix(c, d, smoothstep(0.33, 0.66, s));
  vec3 hi = mix(e, f, smoothstep(0.66, 1.0, s));
  return mix(mix(lo, mid, smoothstep(0.25, 0.5, s)),
             hi, smoothstep(0.6, 0.9, s));
}

void main(){
  vec2 uv = gl_FragCoord.xy / u_res;
  vec2 p = (gl_FragCoord.xy - 0.5 * u_res) / min(u_res.x, u_res.y);

  float t = u_time * 0.15;

  /* Two offset noise layers for displacement */
  vec2 q = vec2(
    fbm(p * 1.8 + vec2(0.0, t)),
    fbm(p * 1.8 + vec2(5.2, t * 0.7))
  );

  vec2 r = vec2(
    fbm(p * 2.4 + q * 1.6 + vec2(1.7, t * 0.8)),
    fbm(p * 2.4 + q * 1.6 + vec2(8.3, t * 0.6))
  );

  float f = fbm(p + r * 1.2);

  /* Colour from palette */
  vec3 col = palette(f + length(q) * 0.8 + t * 0.3);

  /* Light vignette */
  float vig = 1.0 - 0.15 * pow(length(uv - 0.5) * 1.4, 2.0);
  col *= vig;

  /* Boost contrast */
  col = pow(col, vec3(0.85));
  col *= 1.15;

  /* Film grain */
  float grain = fract(sin(dot(gl_FragCoord.xy + u_time, vec2(12.9898, 78.233))) * 43758.5453);
  col += (grain - 0.5) * 0.015;

  gl_FragColor = vec4(col, 1.0);
}
`;

/* Compile helpers */
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
    gl.deleteShader(s);
    return null;
  }
  return s;
}

const vs = compile(gl.VERTEX_SHADER, VERT);
const fs = compile(gl.FRAGMENT_SHADER, FRAG);
const prog = gl.createProgram();
gl.attachShader(prog, vs);
gl.attachShader(prog, fs);
gl.linkProgram(prog);
gl.useProgram(prog);

/* Full-screen quad */
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

/* Uniforms */
const uRes = gl.getUniformLocation(prog, 'u_res');
const uTime = gl.getUniformLocation(prog, 'u_time');

/* Render loop */
let start = performance.now();
function frame() {
  const t = (performance.now() - start) * 0.001;
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, t);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
