<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid Collage Announcement Post</title>
<style>
  :root{
    --bg-page: #e9e6df;
    --cream: #f5f3ed;
    --ink: #14130f;
    --charcoal: #111111;
    --paper: #f5f3ed;
    --accent: #3b56d9;
    --accent-ink: #ffffff;
    --line: rgba(20,19,15,0.14);
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--bg-page);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height:100%;
    display:flex; align-items:center; justify-content:center;
    padding: 32px 16px;
  }

  .stage{
    width: min(92vw, 640px);
  }

  .post{
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--ink);
    display: grid;
    grid-template-columns: 1.65fr 1fr;
    grid-template-rows: 1fr 1fr;
    grid-template-areas:
      "headline label"
      "headline meta";
    gap: 2px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.05);
  }

  .panel{
    position: relative;
    overflow: hidden;
    padding: clamp(18px, 4.2%, 34px);
    display:flex;
    flex-direction: column;
  }

  /* large panel — headline */
  .panel-headline{
    grid-area: headline;
    background: var(--cream);
    color: var(--ink);
    justify-content: flex-end;
  }
  .eyebrow{
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: clamp(10px, 1.6vw, 12px);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink);
    opacity: 0.55;
    margin: 0 0 auto 0;
  }
  .headline{
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-weight: 700;
    font-size: clamp(28px, 6.4vw, 46px);
    line-height: 1.05;
    letter-spacing: -0.01em;
    margin: 0 0 6px 0;
  }
  .headline .dash{
    color: rgba(20,19,15,0.34);
    font-weight: 400;
  }
  .headline-rule{
    width: 46px;
    height: 2px;
    background: var(--ink);
    opacity: 0.5;
    margin-top: 14px;
  }

  /* top-right panel — label tag */
  .panel-label{
    grid-area: label;
    background: var(--accent);
    color: var(--accent-ink);
    align-items: flex-start;
    justify-content: space-between;
  }
  .tag{
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: clamp(11px, 2vw, 14px);
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .tag-mark{
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-ink);
    align-self: flex-start;
  }
  .tag-foot{
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: clamp(9px, 1.4vw, 11px);
    letter-spacing: 0.1em;
    opacity: 0.8;
  }

  /* bottom-right panel — meta / placeholder details */
  .panel-meta{
    grid-area: meta;
    background: var(--charcoal);
    color: #f2f1ee;
    justify-content: space-between;
  }
  .meta-rule{
    width: 100%;
    height: 1px;
    background: rgba(242,241,238,0.18);
  }
  .meta-label{
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: clamp(9px, 1.5vw, 11px);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0.55;
    margin: 0 0 6px 0;
  }
  .meta-value{
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: clamp(14px, 2.6vw, 18px);
    line-height: 1.3;
  }

  .caption{
    margin-top: 14px;
    font-size: 13px;
    color: var(--ink);
    opacity: 0.6;
    text-align: center;
  }

  @media (max-width: 420px){
    .post{ grid-template-columns: 1.4fr 1fr; }
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="post" data-od-id="post">

      <div class="panel panel-headline" data-od-id="panel-headline">
        <p class="eyebrow">Announcement</p>
        <h1 class="headline">— Announcement<br>Headline —</h1>
        <div class="headline-rule"></div>
      </div>

      <div class="panel panel-label" data-od-id="panel-label">
        <span class="tag-mark" aria-hidden="true"></span>
        <span class="tag">Out Now</span>
        <span class="tag-foot">01</span>
      </div>

      <div class="panel panel-meta" data-od-id="panel-meta">
        <div class="meta-rule"></div>
        <div>
          <p class="meta-label">Details</p>
          <p class="meta-value">— where / when —</p>
        </div>
      </div>

    </div>
    <p class="caption">1:1 · grid-collage-announcement</p>
  </div>

</body>
</html>
