<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Birthday Invitation — Bold</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --coral: #FF4B33;
    --ink: #1B1610;
    --cream: #FBF4E9;
    --line: rgba(27,22,16,0.16);
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0;
    background:#EDEAE2;
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 48px 16px;
  }
  .card{
    width: 480px;
    height: 672px;
    background: var(--cream);
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .block{
    background: var(--coral);
    color: var(--cream);
    flex: 0 0 62%;
    position: relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 32px 28px 20px;
  }
  .eyebrow{
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    font-weight: 700;
    opacity: 0.88;
    margin: 0 0 6px;
  }
  .numeral{
    font-size: 232px;
    line-height: 0.86;
    font-weight: 900;
    letter-spacing: -0.03em;
    margin: 0;
  }
  .headline{
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 10px 0 0;
  }
  .info{
    flex: 1;
    padding: 26px 34px 30px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap: 14px;
  }
  .info .name{
    font-size: 21px;
    font-weight: 800;
    color: var(--ink);
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }
  .row:first-of-type{ border-top: none; padding-top: 0; }
  .label{
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--coral);
    white-space: nowrap;
  }
  .value{
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    text-align: right;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="block">
      <p class="eyebrow">Turning</p>
      <p class="numeral">—</p>
      <p class="headline">You're invited!</p>
    </div>
    <div class="info">
      <p class="name">— Name —</p>
      <div class="row">
        <span class="label">Date</span>
        <span class="value">—</span>
      </div>
      <div class="row">
        <span class="label">Time</span>
        <span class="value">—</span>
      </div>
      <div class="row">
        <span class="label">Location</span>
        <span class="value">—</span>
      </div>
      <div class="row">
        <span class="label">RSVP</span>
        <span class="value">—</span>
      </div>
    </div>
  </div>
</body>
</html>
