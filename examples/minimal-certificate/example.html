<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificate of Completion</title>
<style>
  @media print {
    @page { size: 11in 8.5in; margin: 0; }
    html, body { width: 11in; height: 8.5in; }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #e9e9e6;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: Georgia, "Iowan Old Style", Charter, serif;
  }

  .sheet {
    width: 11in;
    height: 8.5in;
    max-width: 100%;
    aspect-ratio: 11 / 8.5;
    background: #fbfaf7;
    color: #17181a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8%;
    text-align: center;
  }

  .eyebrow {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #55575c;
    margin: 0 0 6%;
  }

  .name {
    font-size: clamp(2.6rem, 6vw, 4.6rem);
    line-height: 1.05;
    font-weight: 400;
    letter-spacing: 0.01em;
    margin: 0;
  }

  .rule {
    width: 64px;
    height: 1px;
    background: #17181a;
    opacity: 0.35;
    margin: 3.5% 0;
  }

  .course {
    font-size: clamp(1rem, 1.7vw, 1.3rem);
    font-style: italic;
    font-weight: 400;
    color: #33353a;
    margin: 0;
    max-width: 34ch;
  }

  .meta {
    margin-top: 9%;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #6a6c71;
    display: flex;
    gap: 0.75em;
    align-items: center;
  }

  .meta span.sep {
    opacity: 0.5;
  }
</style>
</head>
<body>
  <div class="sheet">
    <p class="eyebrow">Certificate of Completion</p>
    <h1 class="name">— Recipient Name —</h1>
    <div class="rule"></div>
    <p class="course">— Course Name —</p>
    <div class="meta">
      <span>— Issuer —</span>
      <span class="sep">·</span>
      <span>— Date —</span>
      <span class="sep">·</span>
      <span>Credential ID — —— —</span>
    </div>
  </div>
</body>
</html>
