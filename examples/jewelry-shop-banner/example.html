<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Handmade Jewelry — Shop Banner</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:#efe6da;
    --clay:#c98f6b;
    --ink:#2b2420;
    --muted:#7a6a5e;
    --gold:#b58a4c;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:#d8cfc4;
    display:grid;
    place-items:center;
    padding:40px 0;
    font-family:'Inter', sans-serif;
    color:var(--ink);
  }
  /* shop-banner: 1920 × 800, shown at 1200 × 500 */
  .banner{
    width:1200px;
    max-width:96vw;
    aspect-ratio:1920/800;
    background:var(--sand);
    display:grid;
    grid-template-columns:1.05fr 1fr;
    overflow:hidden;
    position:relative;
    box-shadow:0 30px 70px -30px rgba(0,0,0,.35);
  }
  .copy{
    padding:0 0 0 76px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .eyebrow{
    font-size:12px;
    font-weight:600;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:22px;
  }
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size:76px;
    line-height:.98;
    letter-spacing:-.01em;
    margin:0 0 20px;
  }
  h1 em{ font-style:italic; color:var(--clay); }
  .dek{
    font-size:17px;
    line-height:1.55;
    color:var(--muted);
    max-width:32ch;
    margin:0 0 30px;
  }
  .cta{
    display:inline-flex;
    align-self:flex-start;
    align-items:center;
    gap:12px;
    background:var(--ink);
    color:var(--sand);
    font-size:14px;
    font-weight:500;
    letter-spacing:.04em;
    padding:15px 26px;
    border-radius:999px;
  }
  .cta::after{ content:"→"; font-size:16px; }
  .stage{
    position:relative;
    background:var(--clay);
  }
  /* an arch "window", the usual product-photo crop for handmade shops */
  .arch{
    position:absolute;
    left:12%;
    right:12%;
    top:12%;
    bottom:0;
    background:#e9d6c5;
    border-radius:999px 999px 0 0;
    display:grid;
    place-items:center;
  }
  .arch svg{ width:72%; height:auto; }
  .tag{
    position:absolute;
    right:24px;
    bottom:24px;
    background:var(--sand);
    font-size:12px;
    line-height:1.4;
    padding:10px 14px;
    color:var(--muted);
  }
  .tag b{ color:var(--ink); font-weight:600; display:block; }
</style>
</head>
<body>
  <main class="banner" data-od-card>
    <section class="copy">
      <div class="eyebrow">New collection · Handmade in small batches</div>
      <h1>The <em>Tidepool</em><br>Collection</h1>
      <p class="dek">Recycled silver rings and pendants shaped by hand, each one a little different from the next.</p>
      <span class="cta">Shop the collection</span>
    </section>
    <section class="stage" aria-label="Product photo area">
      <div class="arch">
        <!-- Stand-in line drawing for the product photo: swap for the seller's own shot -->
        <svg viewBox="0 0 300 220" fill="none" stroke-linecap="round">
          <ellipse cx="108" cy="132" rx="62" ry="62" stroke="#b58a4c" stroke-width="9"/>
          <ellipse cx="108" cy="132" rx="62" ry="62" stroke="#f6eadc" stroke-width="2" stroke-dasharray="2 14" transform="rotate(-20 108 132)"/>
          <path d="M210 20 C 200 70, 196 92, 214 120" stroke="#2b2420" stroke-width="2.5"/>
          <path d="M210 20 C 222 66, 230 92, 214 120" stroke="#2b2420" stroke-width="2.5"/>
          <circle cx="214" cy="146" r="24" fill="#c98f6b"/>
          <circle cx="206" cy="138" r="6" fill="#efe6da" opacity=".7"/>
          <circle cx="58" cy="44" r="4" fill="#b58a4c"/>
          <circle cx="262" cy="196" r="3" fill="#b58a4c"/>
        </svg>
      </div>
      <div class="tag"><b>— Product name —</b>— price —</div>
    </section>
  </main>
</body>
</html>
